services:
  clubhouse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clubhouse-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - DB_PATH=/app/data/app.db
    volumes:
      - ./data:/app/data

  # Optional Cloudflare Tunnel: run `docker compose --profile tunnel up -d`
  # with CLOUDFLARE_TUNNEL_TOKEN set in .env
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: clubhouse-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - clubhouse
